<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Shield background -->
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a472a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2d1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Shield -->
  <path d="M 100 20 L 160 50 L 160 110 C 160 150 100 180 100 180 C 100 180 40 150 40 110 L 40 50 Z" fill="url(#shieldGradient)" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Inner Shield Circle -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Star - represents excellence and military pride -->
  <g transform="translate(100, 85)">
    <polygon points="0,-25 7.5,-8 25,-8 12.5,3 18,22 0,11 -18,22 -12.5,3 -25,-8 -7.5,-8" fill="#d4af37"/>
  </g>
  
  <!-- Sword silhouette -->
  <g transform="translate(100, 110)">
    <rect x="-2" y="-30" width="4" height="35" fill="#d4af37"/>
    <path d="M -8 0 L 0 5 L 8 0 Z" fill="#d4af37"/>
  </g>
  
  <!-- Text - PMA -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#d4af37" letter-spacing="2">PMA</text>
</svg>